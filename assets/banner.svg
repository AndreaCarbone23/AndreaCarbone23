    Computer Engineering @ Politecnico di Milano
  </text>

  <!-- Interests -->
  <text x="65" y="368"
        fill="#A1A1AA"
        font-family="Arial, Helvetica, sans-serif"
        font-size="17"
        letter-spacing="4">
    AI / SOFTWARE / ROBOTICS
  </text>
</svg>